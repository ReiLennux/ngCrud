<!-- g-paginator.component.html -->
<div class="flex flex-col sm:flex-row justify-between items-center bg-white dark:bg-slate-800 px-6 py-4 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm gap-4">
  <div class="text-sm text-slate-500 dark:text-slate-400">
    Mostrando <span class="font-bold text-slate-900 dark:text-white">{{ (page - 1) * pageSize + 1 }}</span> a 
    <span class="font-bold text-slate-900 dark:text-white">{{ Math.min(page * pageSize, totalSize) }}</span> de 
    <span class="font-bold text-slate-900 dark:text-white">{{ totalSize }}</span> resultados
  </div>

  <nav class="flex items-center gap-1">
    <!-- Prev -->
    <button (click)="prevPage()" [disabled]="page === 1"
      class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all active:scale-95">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <!-- Pages -->
    <div class="flex items-center gap-1 mx-2">
      <button *ngFor="let p of getPages()" (click)="goToPage(p)"
        [class]="p === page 
          ? 'w-10 h-10 rounded-xl bg-emerald-600 text-white font-bold shadow-lg shadow-emerald-500/20' 
          : 'w-10 h-10 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700 font-medium transition-all active:scale-95'">
        {{ p }}
      </button>
    </div>

    <!-- Next -->
    <button (click)="nextPage()" [disabled]="page === totalPages"
      class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all active:scale-95">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </nav>
</div>
