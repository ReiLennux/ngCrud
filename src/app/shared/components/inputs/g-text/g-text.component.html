<div class="flex flex-col gap-2">
  <label
    *ngIf="label"
    [for]="name"
    class="text-sm font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400"
  >
    {{ label }}
  </label>

  <div class="relative group">
    <div *ngIf="icon" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-emerald-500 transition-colors">
      <i [class]="icon"></i>
    </div>
    
    <input
      [id]="name"
      [name]="name"
      [type]="type"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [attr.minlength]="minLength"
      [attr.maxlength]="maxLength"
      [value]="value"
      (input)="onInputChange($event)"
      (blur)="onTouched()"
      [readOnly]="readOnly"
      class="w-full py-3 !bg-slate-50 dark:!bg-slate-900 border !border-slate-200 dark:!border-slate-700 !rounded-2xl text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      [class.pl-11]="icon"
      [class.px-4]="!icon"
      [class.border-rose-500]="validation && errorMessage"
      [class.focus:border-rose-500]="validation && errorMessage"
      required
    />
  </div>

  <p *ngIf="validation && errorMessage" class="text-xs font-medium text-rose-500">
    {{ errorMessage }}
  </p>
</div>
