<section
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-blue-50 dark:from-slate-900 dark:to-slate-800 p-4">
  <div
    class="fixed top-0 -left-4 w-72 h-72 bg-blue-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse">
  </div>
  <div
    class="fixed bottom-0 -right-4 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse">
  </div>

  <div
    class="relative w-full max-w-5xl bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-white/20 dark:border-slate-700/50 rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">

    <div
      class="hidden md:flex md:w-5/12 bg-blue-600 p-12 flex-col justify-center items-center text-white relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-blue-600 to-indigo-700 opacity-90"></div>

      <div class="absolute inset-0 opacity-10"
        style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 24px 24px;">
      </div>

      <div class="relative z-10 text-center space-y-6">
        <div
          class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto shadow-inner mb-8 transform hover:scale-110 transition-transform duration-300">
          <i class="fa-solid fa-rocket text-4xl text-white"></i>
        </div>
        <h1 class="text-4xl font-bold tracking-tight">Bienvenido de nuevo</h1>
        <p class="text-blue-100 text-lg font-light leading-relaxed">
          Gestiona tu negocio de forma inteligente, rápida y segura. Todo en un solo lugar.
        </p>

      </div>
    </div>

    <div class="w-full md:w-7/12 p-8 sm:p-12 lg:p-16 flex flex-col justify-center">
      <div class="max-w-md mx-auto w-full">
        <div class="mb-10">
          <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-2">Inicia Sesión</h2>
          <p class="text-slate-500 dark:text-slate-400">Ingresa tus credenciales para acceder al panel.</p>
        </div>

        <form class="space-y-6" #form="ngForm" (ngSubmit)="onSubmit()">
          <div class="group transition-all duration-200">
            <app-g-text [(ngModel)]="userData.email" name="username" label="Correo Electrónico"
              placeholder="nombre@empresa.com" type="email" [validation]="true">
            </app-g-text>
          </div>

          <div class="group transition-all duration-200">
            <app-g-text [(ngModel)]="userData.strPassword" name="strPassword" label="Contraseña"
              placeholder="•••••••••••" type="password" [validation]="true">
            </app-g-text>
          </div>

          <div class="pt-4">
            <ng-container *ngIf="!loading; else elseTemplate">
              <button type="submit"
                class="w-full py-4 px-6 text-white font-semibold rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 focus:ring-4 focus:ring-blue-500/30 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 shadow-lg shadow-blue-500/25 flex items-center justify-center space-x-2">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
              </button>
            </ng-container>

            <ng-template #elseTemplate>
              <button disabled type="button"
                class="w-full py-4 px-6 text-slate-500 bg-slate-100 dark:bg-slate-800 dark:text-slate-400 font-semibold rounded-2xl inline-flex items-center justify-center cursor-not-allowed">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg"
                  fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                  </path>
                </svg>
                <span>Verificando...</span>
              </button>
            </ng-template>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
