<!-- Delete Button -->
<button type="button" (click)="delete()"
  class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-semibold text-rose-600 hover:text-white border border-rose-200 hover:bg-rose-600 dark:border-rose-800 dark:text-rose-400 dark:hover:text-white dark:hover:bg-rose-600 rounded-xl transition-all active:scale-95">
  <i class="fa-solid fa-trash-can"></i>
  Eliminar
</button>

<!-- Edit Button -->
<button type="button" (click)="toggleModal()"
  class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-semibold text-amber-600 hover:text-white border border-amber-200 hover:bg-amber-500 dark:border-amber-700 dark:text-amber-400 dark:hover:text-white dark:hover:bg-amber-500 rounded-xl transition-all active:scale-95">
  <i class="fa-solid fa-pencil"></i>
  Editar
</button>

<!-- Edit Modal -->
<div *ngIf="showModal"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
  <div class="relative w-full max-w-2xl bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden animate-fade-in">

    <!-- Modal Header -->
    <div class="flex items-center justify-between px-8 py-6 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-amber-100 dark:bg-amber-500/20 rounded-xl">
          <i class="fa-solid fa-pencil text-amber-600 dark:text-amber-400"></i>
        </div>
        <div>
          <h3 class="text-lg font-black text-slate-900 dark:text-white">Editar Producto</h3>
          <p class="text-xs text-slate-400">{{ putProducto.strName }}</p>
        </div>
      </div>
      <button type="button" (click)="toggleModal()"
        class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-all">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-8 space-y-6 max-h-[70vh] overflow-y-auto">

      <!-- Name & Description -->
      <div class="space-y-4">
        <div class="flex items-center gap-2 mb-1">
          <i class="fa-solid fa-circle-info text-emerald-500 text-sm"></i>
          <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Información General</span>
        </div>
        <app-g-text [(ngModel)]="putProducto.strName" name="putStrName"
          label="Nombre del Producto" placeholder="Ej. Coca Cola" type="text">
        </app-g-text>
        <div class="flex flex-col gap-2">
          <label class="text-sm font-bold uppercase tracking-wider text-slate-400">Descripción</label>
          <textarea [(ngModel)]="putProducto.strDescription" name="putStrDescription"
            class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all resize-none min-h-20"
            placeholder="Descripción del producto..."></textarea>
        </div>
      </div>

      <!-- Categories -->
      <div class="space-y-4 pt-4 border-t border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2 mb-1">
          <i class="fa-solid fa-tag text-blue-500 text-sm"></i>
          <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Categorización</span>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <app-g-select
            [(ngModel)]="categoriaSeleccionadoId"
            (ngModelChange)="onCategoriaChange($event)"
            name="putCategory"
            label="Categoría"
            [options]="categorias">
          </app-g-select>
          <app-g-select
            [(ngModel)]="subcategoriaSeleccionadoId"
            (ngModelChange)="onSubcategoriaChange($event)"
            name="putSubcategory"
            label="Subcategoría"
            [options]="subcategorias">
          </app-g-select>
        </div>
      </div>

      <!-- Stock & Prices -->
      <div class="grid grid-cols-2 gap-6 pt-4 border-t border-slate-100 dark:border-slate-700">
        <!-- Stock -->
        <div class="space-y-4">
          <div class="flex items-center gap-2 mb-1">
            <i class="fa-solid fa-boxes-stacked text-blue-500 text-sm"></i>
            <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Inventario</span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <app-g-text [(ngModel)]="putProducto.decMinimum" name="putDecMinimum"
              label="Mínimo" placeholder="0" type="number">
            </app-g-text>
            <app-g-text [(ngModel)]="putProducto.decMaximum" name="putDecMaximum"
              label="Máximo" placeholder="100" type="number">
            </app-g-text>
          </div>
          <app-g-text [(ngModel)]="putProducto.decStock" name="putDecStock"
            label="Stock Actual" placeholder="0" type="number">
          </app-g-text>
        </div>
        <!-- Prices -->
        <div class="space-y-4">
          <div class="flex items-center gap-2 mb-1">
            <i class="fa-solid fa-tags text-amber-500 text-sm"></i>
            <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Precios</span>
          </div>
          <app-g-text [(ngModel)]="putProducto.decCost" name="putDecCost"
            label="Costo" placeholder="0.00" type="number">
          </app-g-text>
          <app-g-text [(ngModel)]="putProducto.decPrice" name="putDecPrice"
            label="Precio de Venta" placeholder="0.00" type="number">
          </app-g-text>
        </div>
      </div>

      <!-- Image -->
      <div class="pt-4 border-t border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2 mb-3">
          <i class="fa-solid fa-image text-purple-500 text-sm"></i>
          <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Imagen</span>
        </div>
        <div class="flex items-center gap-4">
          <img *ngIf="putProducto.strImage && !selectedFile"
            [src]="putProducto.strImage" [alt]="putProducto.strName"
            class="w-20 h-20 rounded-2xl object-cover border border-slate-200 dark:border-slate-600 shadow-sm">
          <label for="edit-file-input"
            class="flex-1 flex items-center gap-3 px-4 py-3 border-2 border-dashed border-slate-200 dark:border-slate-600 rounded-2xl cursor-pointer hover:border-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-500/5 transition-all">
            <i class="fa-solid fa-cloud-arrow-up text-slate-400 text-lg"></i>
            <span class="text-sm text-slate-500">
              {{ selectedFile ? selectedFile.name : 'Cambiar imagen (opcional)' }}
            </span>
          </label>
          <input id="edit-file-input" type="file" class="hidden"
            (change)="onFileSelected($event)" accept="image/*">
        </div>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="flex justify-end gap-3 px-8 py-5 border-t border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
      <button type="button" (click)="toggleModal()"
        class="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-all">
        Cancelar
      </button>
      <button type="button" (click)="update()" [disabled]="isLoading"
        class="inline-flex items-center gap-2 px-6 py-2.5 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-400 disabled:cursor-not-allowed rounded-xl shadow-lg shadow-emerald-500/20 transition-all active:scale-95">
        <i *ngIf="!isLoading" class="fa-solid fa-floppy-disk"></i>
        <i *ngIf="isLoading" class="fa-solid fa-circle-notch fa-spin"></i>
        {{ isLoading ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </div>

  </div>
</div>
