<div class="m-6 max-w-4xl mx-auto space-y-6">
  <!-- Back Button -->
  <div class="flex items-center">
    <a routerLink="/users" class="inline-flex items-center gap-2 text-slate-500 hover:text-emerald-600 font-semibold transition-colors group">
      <div class="p-2 rounded-xl bg-slate-100 group-hover:bg-emerald-50 transition-colors">
        <i class="fa-solid fa-arrow-left"></i>
      </div>
      Volver a la Lista de Usuarios
    </a>
  </div>

  <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200 dark:border-slate-700 overflow-hidden">
    <!-- Header -->
    <div class="p-8 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
      <h2 class="text-2xl font-black text-slate-900 dark:text-white">Registro de Usuario</h2>
      <p class="text-slate-500 dark:text-slate-400 mt-1">Crea una nueva cuenta para gestionar accesos al sistema.</p>
    </div>

    <form class="p-8 space-y-8" #userForm="ngForm" (ngSubmit)="submitForm(userForm)">
      <!-- Account Information -->
      <div class="space-y-6">
        <div class="flex items-center gap-3 mb-2">
          <i class="fa-solid fa-id-card text-blue-500"></i>
          <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400">Información de Cuenta</h3>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <app-g-text 
            [(ngModel)]="user.email" 
            name="email" 
            label="Correo Electrónico" 
            placeholder="ejemplo@empresa.com"
            type="email" 
            [validation]="true">
          </app-g-text>

          <app-g-select 
            [(ngModel)]="user.idUsuCatTipoUsuario" 
            name="idUsuCatTipoUsuario" 
            placeholder="Seleccionar rol"
            label="Tipo de Usuario" 
            [options]="tipos" 
            [validation]="true">
          </app-g-select>
        </div>
      </div>

      <!-- Security -->
      <div class="space-y-6 pt-6 border-t border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-3 mb-2">
          <i class="fa-solid fa-shield-halved text-amber-500"></i>
          <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400">Seguridad</h3>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <app-g-text 
            [(ngModel)]="user.strPassword" 
            name="strPassword" 
            label="Contraseña" 
            placeholder="•••••••••"
            type="password" 
            [validation]="true">
          </app-g-text>

          <div class="space-y-2">
            <app-g-text 
              (keyup)="checkPasswordMatch()" 
              [(ngModel)]="rPassword" 
              name="confirm_password"
              label="Confirmar Contraseña" 
              placeholder="•••••••••" 
              type="password" 
              [validation]="true">
            </app-g-text>
            <p *ngIf="rPassword && !comparePassword" class="text-xs text-rose-500 font-bold flex items-center gap-1 ml-1">
              <i class="fa-solid fa-triangle-exclamation"></i> Las contraseñas no coinciden
            </p>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-6 border-t border-slate-100 dark:border-slate-700">
        <button type="submit" 
          [disabled]="!userForm.valid || !comparePassword"
          class="w-full py-4 px-8 text-white font-black rounded-2xl transition-all duration-300 flex items-center justify-center gap-3 shadow-lg disabled:opacity-50 disabled:bg-slate-300 dark:disabled:bg-slate-700 disabled:shadow-none bg-emerald-600 hover:bg-emerald-700 shadow-emerald-500/25 active:scale-95">
          <i class="fa-solid fa-user-check" *ngIf="userForm.valid && comparePassword"></i>
          {{ !userForm.valid || !comparePassword ? "Completa todos los campos" : "Registrar Usuario" }}
        </button>
      </div>
    </form>
  </div>
</div>
