<!-- Delete Button -->
<button type="button" *ngIf="user.id !== userOnSesion" (click)="deleteButton(user.id)"
  class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-semibold text-rose-600 hover:text-white border border-rose-200 hover:bg-rose-600 dark:border-rose-800 dark:text-rose-400 dark:hover:text-white dark:hover:bg-rose-600 rounded-xl transition-all active:scale-95">
  <i class="fa-solid fa-trash-can"></i>
  Eliminar
</button>

<!-- Edit Button -->
<button (click)="toggleModal()" type="button"
  class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-semibold text-amber-600 hover:text-white border border-amber-200 hover:bg-amber-500 dark:border-amber-700 dark:text-amber-400 dark:hover:text-white dark:hover:bg-amber-500 rounded-xl transition-all active:scale-95">
  <i class="fa-solid fa-pencil"></i>
  Editar
</button>

<!-- Edit Modal -->
<div *ngIf="showModal"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
  <div class="relative w-full max-w-lg bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">

    <!-- Modal Header -->
    <div class="flex items-center justify-between px-8 py-6 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-amber-100 dark:bg-amber-500/20 rounded-xl">
          <i class="fa-solid fa-user-pen text-amber-600 dark:text-amber-400"></i>
        </div>
        <div>
          <h3 class="text-lg font-black text-slate-900 dark:text-white">Editar Usuario</h3>
          <p class="text-xs text-slate-400">{{ putUser.email }}</p>
        </div>
      </div>
      <button (click)="toggleModal()" type="button"
        class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-all">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-8 space-y-6">

      <!-- Account Info -->
      <div class="space-y-4">
        <div class="flex items-center gap-2 mb-1">
          <i class="fa-solid fa-id-card text-blue-500 text-sm"></i>
          <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Información de Cuenta</span>
        </div>
        <app-g-text [(ngModel)]="putUser.email" name="putEmail"
          label="Correo Electrónico" placeholder="user@example.com" type="email" [validation]="true">
        </app-g-text>
      </div>

      <!-- Security -->
      <div class="space-y-4 pt-4 border-t border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2 mb-1">
          <i class="fa-solid fa-shield-halved text-amber-500 text-sm"></i>
          <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Seguridad</span>
        </div>
        <app-g-text [(ngModel)]="putUser.strPassword" name="putPassword"
          label="Nueva Contraseña" placeholder="•••••••••" type="password" [validation]="true">
        </app-g-text>
        <div>
          <app-g-text [(ngModel)]="rPassword" name="putRPassword"
            label="Confirmar Contraseña" placeholder="•••••••••" type="password" [validation]="true">
          </app-g-text>
          <p *ngIf="rPassword && putUser.strPassword !== rPassword"
            class="mt-1.5 text-xs text-rose-500 font-bold flex items-center gap-1 ml-1">
            <i class="fa-solid fa-triangle-exclamation"></i> Las contraseñas no coinciden
          </p>
        </div>
      </div>

      <!-- Role & Status -->
      <div class="space-y-4 pt-4 border-t border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2 mb-1">
          <i class="fa-solid fa-user-tag text-emerald-500 text-sm"></i>
          <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Rol y Estado</span>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <app-g-select [(ngModel)]="putUser.idUsuCatTipoUsuario" name="putUserType"
            placeholder="Tipo de usuario" label="Tipo de Usuario"
            [options]="tipos" [validation]="true">
          </app-g-select>
          <app-g-select [(ngModel)]="putUser.idUsuCatEstadoFK" name="putUserState"
            placeholder="Estado" label="Estado"
            [options]="estados" [validation]="true">
          </app-g-select>
        </div>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="flex justify-end gap-3 px-8 py-5 border-t border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
      <button type="button" (click)="toggleModal()"
        class="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-all">
        Cancelar
      </button>
      <button type="button" (click)="update()"
        class="inline-flex items-center gap-2 px-6 py-2.5 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-lg shadow-emerald-500/20 transition-all active:scale-95">
        <i class="fa-solid fa-floppy-disk"></i>
        Guardar Cambios
      </button>
    </div>

  </div>
</div>
